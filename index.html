    // ==========================================
    // 2. CONSOLIDATED STORAGE LAYER (subjects:all & history:all)
    // ==========================================
    const STORAGE_KEYS = {
      SUBJECTS_ALL: "subjects:all",     // Consolidated bulk subject storage
      HISTORY_ALL: "history:all",       // Bulk question history
      SESSION_CURRENT: "session:current",
      VERSION: "storage:version",
      // Legacy keys for backward-compatibility migration
      LEGACY_SUBJECTS_LIST: "subjects:list",
      LEGACY_SUBJECT_PREFIX: "subject:"
    };

    const StorageService = {
      async get(key) {
        try {
          if (window.storage && typeof window.storage.get === "function") {
            const res = await window.storage.get(key);
            return res ? (typeof res === "string" ? JSON.parse(res) : res) : null;
          }
          if (window.storage && typeof window.storage.getItem === "function") {
            const res = await window.storage.getItem(key);
            return res ? JSON.parse(res) : null;
          }
          const local = localStorage.getItem(key);
          return local ? JSON.parse(local) : null;
        } catch (e) {
          console.warn(`StorageService.get failed for key "${key}":`, e);
          const local = localStorage.getItem(key);
          return local ? JSON.parse(local) : null;
        }
      },

      async set(key, value) {
        try {
          const stringified = JSON.stringify(value);
          localStorage.setItem(key, stringified);
          if (window.storage && typeof window.storage.set === "function") {
            await window.storage.set(key, stringified);
          } else if (window.storage && typeof window.storage.setItem === "function") {
            await window.storage.setItem(key, stringified);
          }
          return true;
        } catch (e) {
          console.error(`StorageService.set failed for key "${key}":`, e);
          return false;
        }
      },

      async remove(key) {
        try {
          localStorage.removeItem(key);
          if (window.storage && typeof window.storage.remove === "function") {
            await window.storage.remove(key);
          } else if (window.storage && typeof window.storage.removeItem === "function") {
            await window.storage.removeItem(key);
          }
          return true;
        } catch (e) {
          console.warn(`StorageService.remove failed for key "${key}":`, e);
          return false;
        }
      }
    };

    // ==========================================
    // 3. CROSS-PLATFORM, FENCE-AWARE MARKDOWN PARSER
    // ==========================================
    function normalizeLineEndings(raw) {
      if (!raw) return "";
      return raw.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    }

    function hashString(str) {
      let hash = 5381;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) + hash) + str.charCodeAt(i);
        hash = hash & hash;
      }
      return Math.abs(hash).toString(16).padStart(6, "0").slice(-6);
    }

    function normalizeComparisonText(str) {
      if (!str) return "";
      return str.toLowerCase().replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim();
    }

    function formatQuestionText(text) {
      if (!text) return "";
      return text.replace(/^(?:Q\d+|Question\s*\d+)[\s.:–-]+|\d+[.)]\s*/i, "").trim();
    }

    function parseMarkdownQuestions(rawMarkdown, subjectSlug, subjectName) {
      const normalized = normalizeLineEndings(rawMarkdown);
      const lines = normalized.split("\n");
      
      const questions = [];
      const warnings = [];
      const errors = [];

      let currentQ = null;
      let currentAnswerLines = [];
      let inCodeFence = false;
      let questionIndex = 1;

      function commitCurrentQuestion() {
        if (!currentQ) return;
        
        let answerText = currentAnswerLines.join("\n").trim();
        // Remove leading **A.** or **A:** or A.
        answerText = answerText.replace(/^\*\*(?:A|Ans|Answer)\.?\*\*:?\s*/i, "");
        answerText = answerText.replace(/^(?:A|Ans|Answer)\.?\s*[:.-]\s*/i, "");

        if (!currentQ.question) {
          warnings.push(`Question #${questionIndex} had an empty title and was skipped.`);
        } else if (!answerText) {
          warnings.push(`"${currentQ.question.slice(0, 40)}..." is missing an answer block.`);
          currentQ.answer = "(No official answer provided in source markdown)";
          questions.push(currentQ);
        } else {
          currentQ.answer = answerText;
          questions.push(currentQ);
        }

        currentQ = null;
        currentAnswerLines = [];
        questionIndex++;
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();

        // Detect code fence boundary (``` or ~~~)
        if (trimmed.startsWith("```") || trimmed.startsWith("~~~")) {
          inCodeFence = !inCodeFence;
          if (currentQ) {
            currentAnswerLines.push(line);
          }
          continue;
        }

        // If inside code fence, content is NEVER a structural divider!
        if (inCodeFence) {
          if (currentQ) {
            currentAnswerLines.push(line);
          }
          continue;
        }

        // Standalone Q<N> line followed by question title on next non-empty line
        const standaloneMatch = trimmed.match(/^(?:#{1,3}\s+)?Q(?:uestion)?\s*(\d+)$/i);
        if (standaloneMatch && i + 1 < lines.length) {
          let j = i + 1;
          while (j < lines.length && !lines[j].trim()) j++;
          if (j < lines.length && !lines[j].trim().startsWith("---") && !lines[j].trim().startsWith("```") && !lines[j].trim().startsWith("~~~")) {
            commitCurrentQuestion();
            const sourceKey = `Q${standaloneMatch[1]}`;
            const qText = lines[j].trim().replace(/^[:.\-–]+\s*/, "");
            const stableHash = hashString(normalizeComparisonText(qText));
            const id = `${subjectSlug}-${sourceKey.toLowerCase()}-${stableHash}`;
            currentQ = {
              id,
              sourceKey,
              subject: subjectSlug,
              subjectName: subjectName || subjectSlug.toUpperCase(),
              question: qText,
              answer: ""
            };
            i = j;
            continue;
          }
        }

        // Primary format: (### | ## | #)? Q<N>[:.-]? Question text OR ### Question text
        const qPrefixMatch = line.match(/^(?:#{1,3}\s+)?(?:Q(?:uestion)?\s*(\d+)[\s.:–-]+)(.+)$/i);
        const headingMatch = line.match(/^###\s+(.+)$/);
        if (qPrefixMatch || headingMatch) {
          commitCurrentQuestion();

          const sourceKey = qPrefixMatch ? `Q${qPrefixMatch[1]}` : `Q${questionIndex}`;
          let qText = qPrefixMatch ? qPrefixMatch[2] : headingMatch[1];
          qText = qText.replace(/^[:.\-–]+\s*/, "").trim();
          const stableHash = hashString(normalizeComparisonText(qText));
          const id = `${subjectSlug}-${sourceKey.toLowerCase()}-${stableHash}`;

          currentQ = {
            id,
            sourceKey,
            subject: subjectSlug,
            subjectName: subjectName || subjectSlug.toUpperCase(),
            question: qText,
            answer: ""
          };
          continue;
        }

        // If outside code fence and encounters divider like '---' or '## Section'
        if (currentQ && (trimmed === "---" || trimmed === "***" || line.match(/^##\s+/))) {
          if (currentAnswerLines.length > 0 && currentAnswerLines.some(l => l.trim().length > 0)) {
            commitCurrentQuestion();
            continue;
          }
        }

        // Accumulate answer lines
        if (currentQ) {
          currentAnswerLines.push(line);
        }
      }

      commitCurrentQuestion();

      // Fallback parser: if primary parser found 0 questions, try ## headings as questions
      if (questions.length === 0) {
        warnings.push("Primary '### Q<N>.' parser found 0 questions. Attempting fallback parser on '##' and '###' headings...");
        
        let fbQ = null;
        let fbLines = [];
        let fbIndex = 1;
        inCodeFence = false;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const trimmed = line.trim();

          if (trimmed.startsWith("```") || trimmed.startsWith("~~~")) {
            inCodeFence = !inCodeFence;
            if (fbQ) fbLines.push(line);
            continue;
          }
          if (inCodeFence) {
            if (fbQ) fbLines.push(line);
            continue;
          }

          const headingMatch = line.match(/^(?:##|###)\s+(.+)$/);
          if (headingMatch) {
            if (fbQ) {
              fbQ.answer = fbLines.join("\n").trim() || "(No answer block provided)";
              questions.push(fbQ);
              fbLines = [];
            }
            let qTitle = headingMatch[1].trim();
            let sourceKey = `Q${fbIndex++}`;
            const fbQMatch = qTitle.match(/^(?:Q(?:uestion)?\s*(\d+)[\s.:–-]*)(.+)$/i);
            if (fbQMatch) {
              sourceKey = `Q${fbQMatch[1]}`;
              qTitle = fbQMatch[2].replace(/^[:.\-–]+\s*/, "").trim();
            }
            const id = `${subjectSlug}-${sourceKey.toLowerCase()}-${hashString(normalizeComparisonText(qTitle))}`;
            fbQ = {
              id,
              sourceKey,
              subject: subjectSlug,
              subjectName: subjectName || subjectSlug.toUpperCase(),
              question: qTitle,
              answer: ""
            };
            continue;
          }

          if (fbQ) {
            fbLines.push(line);
          }
        }

        if (fbQ) {
          fbQ.answer = fbLines.join("\n").trim() || "(No answer block provided)";
          questions.push(fbQ);
        }
      }

      if (questions.length === 0) {
        errors.push("No valid questions could be recognized in the provided Markdown. Please ensure headings follow the format: '### Q1. What is a process?' followed by '**A.** Answer content.'");
      }

      return { questions, warnings, errors };
    }

    // ==========================================
    // 4. QUESTION RECONCILIATION & STABLE IDENTITY
    // ==========================================
    function reconcileQuestions(oldQuestions = [], newParsedQuestions = [], subjectSlug) {
      const oldByNormText = new Map();

      for (const oq of oldQuestions) {
        const norm = normalizeComparisonText(oq.question);
        if (!oldByNormText.has(norm)) oldByNormText.set(norm, []);
        oldByNormText.get(norm).push(oq);
      }

      const assignedIds = new Set();
      const reconciled = [];

      for (const nq of newParsedQuestions) {
        const norm = normalizeComparisonText(nq.question);
        let matchedId = null;

        // Strict identity rule: match by identical normalized question text.
        // This guarantees that reordering, inserting, or deleting questions in a file
        // NEVER misattaches learning history to an unrelated question!
        if (oldByNormText.has(norm) && oldByNormText.get(norm).length === 1) {
          matchedId = oldByNormText.get(norm)[0].id;
        }

        // Truly new question or collided text -> Generate new ID with collision protection
        if (!matchedId || assignedIds.has(matchedId)) {
          let baseId = `${subjectSlug}-${nq.sourceKey ? nq.sourceKey.toLowerCase() + "-" : ""}${hashString(norm)}`;
          let id = baseId;
          let counter = 1;
          while (assignedIds.has(id)) {
            id = `${baseId}-${counter++}`;
          }
          matchedId = id;
        }

        assignedIds.add(matchedId);
        reconciled.push({
          ...nq,
          id: matchedId,
          subject: subjectSlug
        });
      }

      return reconciled;
    }

    // ==========================================
    // 5. ADAPTIVE QUESTION SELECTION ALGORITHM
    // ==========================================
    function calculateQuestionWeight(questionId, historyMap) {
      const hist = historyMap[questionId];
      if (!hist) {
        return 3.0; // Unseen: medium-high priority
      }

      const now = Date.now();
      const daysSinceSeen = (now - (hist.lastSeenAt || now)) / (1000 * 60 * 60 * 24);
      const recencyBoost = daysSinceSeen > 3 ? 1.5 : 1.0;

      if (hist.lastResult === "wrong") {
        return (hist.timesWrong >= 3 ? 6.0 : 5.0) * recencyBoost;
      }

      // lastResult === "right"
      if (hist.currentStreak >= 5) {
        return 0.5; // Well mastered
      }
      if (hist.currentStreak >= 2) {
        return 1.0 * recencyBoost;
      }
      return 2.0 * recencyBoost;
    }
    const computeWeight = calculateQuestionWeight;

    function getCooldownWindowSize(totalPoolCount) {
      if (totalPoolCount <= 2) return 0;
      return Math.min(10, Math.max(1, Math.floor(totalPoolCount / 3)));
    }

    function selectNextQuestion(pool, historyMap, askedQueue = [], currentQuestionId = null) {
      if (!pool || pool.length === 0) return null;
      if (pool.length === 1) return pool[0];

      const cooldownN = getCooldownWindowSize(pool.length);
      const recentIds = askedQueue.slice(-cooldownN);

      // Filter eligible questions outside cooldown
      let eligible = pool.filter(q => !recentIds.includes(q.id));

      // Avoid immediate repeat of the current question if pool allows
      if (eligible.length > 1 && currentQuestionId) {
        eligible = eligible.filter(q => q.id !== currentQuestionId);
      }

      // If cooldown exhausted the pool, fallback gracefully to full pool rather than deadlocking
      if (eligible.length === 0) {
        eligible = pool.length > 1 && currentQuestionId 
          ? pool.filter(q => q.id !== currentQuestionId) 
          : pool;
      }

      // Weighted random selection
      const weights = eligible.map(q => calculateQuestionWeight(q.id, historyMap));
      const totalWeight = weights.reduce((sum, w) => sum + w, 0);
      
      let randomVal = Math.random() * totalWeight;
      for (let i = 0; i < eligible.length; i++) {
        randomVal -= weights[i];
        if (randomVal <= 0) {
          return eligible[i];
        }
      }

      return eligible[eligible.length - 1];
    }

    // ==========================================
    // 6. PRE-LOADED STANDARD CURATED QUESTION PACKS
    // ==========================================
    const DEFAULT_SUBJECT_PACKS = [
      {
        slug: "os",
        name: "Operating Systems",
        raw: `### Q1. What is the difference between a process and a thread?
**A.** A process is an independent executing program with its own dedicated memory space, address space, and system resources allocated by the operating system. 
A thread is the smallest unit of execution within a process, often called a lightweight process. Threads within the same process share code, data, and open file descriptors, but each thread has its own program counter, registers, and call stack. Creating or switching threads has much lower overhead than processes.

### Q2. What are the four necessary conditions for Deadlock to occur?
**A.** The four Coffman conditions are:
1. **Mutual Exclusion**: At least one resource must be held in a non-shareable mode.
2. **Hold and Wait**: A process must currently hold at least one resource and be waiting to acquire additional resources held by other processes.
3. **No Preemption**: Resources cannot be forcibly taken from a process; they can only be released voluntarily after completion.
4. **Circular Wait**: A closed chain of processes exists such that each process holds at least one resource needed by the next process in the chain.

### Q3. Explain Virtual Memory, Paging, and Page Faults.
**A.** Virtual memory is a memory management technique that provides an "idealized abstraction of storage resources" larger than physical RAM. It maps virtual addresses used by programs to physical addresses in RAM or secondary storage (swap/pagefile).
- **Paging**: Dividing virtual address space into fixed-size blocks called pages, and physical memory into matching frames.
- **Page Fault**: A hardware interrupt raised when a program attempts to access a page in virtual memory that is not currently loaded into physical RAM. The OS page fault handler fetches the missing page from disk into a free frame.`
      },
      {
        slug: "dbms",
        name: "Database Management Systems",
        raw: `### Q1. What are the ACID properties in database transactions?
**A.** ACID ensures transaction reliability in databases:
- **Atomicity**: All operations in a transaction succeed completely or none take effect ("all or nothing").
- **Consistency**: A transaction moves the database from one valid state to another, satisfying all integrity constraints and schemas.
- **Isolation**: Concurrent transactions execute independently without interfering with or observing each other's intermediate uncommitted states.
- **Durability**: Once a transaction commits, its changes are permanently recorded in non-volatile storage and survive system crashes.

### Q2. Compare Clustered vs Non-Clustered Indexes.
**A.** 
- **Clustered Index**: Determines the physical ordering of data rows in the storage table. A table can have only ONE clustered index because data can only be physically sorted one way. The leaf nodes of a clustered index contain the actual data rows.
- **Non-Clustered Index**: A separate data structure containing sorted index keys and pointers (row locators or primary key values) referencing the physical data rows. A table can have multiple non-clustered indexes for optimizing different queries.

### Q3. Explain Database Normalization (1NF, 2NF, 3NF, BCNF).
**A.** Normalization reduces data redundancy and prevents update/insert/delete anomalies:
- **1NF**: Atomic values (no repeating groups or comma-separated lists) with a primary key.
- **2NF**: In 1NF + No partial dependencies (every non-key attribute must depend on the whole primary key, not part of a composite key).
- **3NF**: In 2NF + No transitive dependencies (non-key attributes must not depend on other non-key attributes).
- **BCNF**: A stricter version of 3NF where for every functional dependency X -> Y, X must be a super key.`

**A.** JavaScript is single-threaded and uses a non-blocking, event-driven runtime:
1. **Call Stack**: Executes synchronous code line-by-line (LIFO).
2. **Web APIs**: Handles asynchronous operations (DOM events, timers, fetch) off the main thread.
3. **Microtask Queue**: Receives promise callbacks (\`.then\`, \`async/await\`, \`queueMicrotask\`, \`MutationObserver\`).
4. **Macrotask (Task) Queue**: Receives timer callbacks (\`setTimeout\`, \`setInterval\`, \`setImmediate\`, I/O).
The Event Loop continuously checks if the Call Stack is empty. When empty, it drains the entire **Microtask Queue** before processing the next macrotask.`

          {/* ==================================================== */}
          {reuploadConfirmModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl border border-black/20 p-8 max-w-lg w-full shadow-2xl space-y-5">
                <div className="flex items-center gap-3 text-[#ff5a24]">
                  <Icon name="alert-triangle" className="size-6" />
                  <h3 className="font-serif text-2xl text-black">Reconcile Subject Upload?</h3>
                </div>
                <p className="text-sm text-[#444] leading-relaxed">
                  A subject with slug <code className="font-bold text-black bg-black/5 px-1 py-0.5 rounded">{reuploadConfirmModal.slug}</code> already exists with {reuploadConfirmModal.oldQuestionsCount} questions.
                </p>
                <p className="text-xs text-[#666] leading-relaxed bg-[#f6f5f2] p-3 rounded-xl border border-black/10">
                  Stable Question Reconciliation will preserve existing streaks and history for matching questions, assign new IDs for genuinely new material, and leave deleted question history orphaned without misattributing it.
                </p>
                <div className="flex justify-end gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setReuploadConfirmModal(null)}
                    className="px-5 py-2.5 rounded-xl border border-black/20 text-sm font-medium hover:bg-black/5"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={() => handleSaveSubject(true)}
                    className="px-6 py-2.5 rounded-xl bg-[#ff5a24] text-white text-sm font-medium hover:bg-[#e04816] shadow"
                  >
                    Confirm & Reconcile
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ==================================================== */}
          {/* RESUME SESSION MODAL */}
          {/* ==================================================== */}
          {resumePromptModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl border border-black/20 p-8 max-w-md w-full shadow-2xl space-y-5 text-center">
                <Icon name="sparkles" className="size-10 text-[#ff5a24] mx-auto" />
                <h3 className="font-serif text-2xl text-black">Resume Unfinished Session?</h3>
                <p className="text-sm text-[#555] leading-relaxed">
                  You have an in-progress interview session with score {resumePromptModal.session.score.right} ✅ / {resumePromptModal.session.score.wrong} ❌. Would you like to resume where you left off?
                </p>
                <div className="flex justify-center gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => {
                      StorageService.remove(STORAGE_KEYS.SESSION_CURRENT);
                      setResumePromptModal(null);
                      initFreshSession(combinedPool, historyMap);
                    }}
                    className="px-5 py-2.5 rounded-xl border border-black/20 text-sm font-medium hover:bg-black/5"
                  >
                    Start Fresh
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setSession(resumePromptModal.session);
                      setResumePromptModal(null);
                      setCurrentView("interview");
                    }}
                    className="px-6 py-2.5 rounded-xl bg-[#111111] text-white text-sm font-medium hover:bg-black shadow"
                  >
                    Resume Session
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="w-full py-6 text-center text-xs text-[#777] border-t border-black/10 mt-12">
            Mockflow Technical Interview Simulator • Adaptive Learning Engine • All Questions Mixed Across Active Subjects
          </footer>
        </div>
      );
    }

    // Render the React App
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
